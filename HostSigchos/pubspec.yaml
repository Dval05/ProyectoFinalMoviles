name: frontend
description: "HostSigchos - Sistema de Reservas de Hosterías de Sigchos"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3

  # Google Sign-In
  google_sign_in: ^7.2.0
  # Security & Biometrics
  local_auth: ^3.0.1
  local_auth_android: ^2.0.9
  local_auth_darwin: ^2.0.3
  flutter_secure_storage: ^10.3.1

  # State Management
  provider: ^6.1.2

  # Google Maps & Location
  geolocator: ^14.0.3
  
  # API REST (Geocoding)
  http: ^1.3.0

  # Camera (Hardware)
  image_picker: ^1.1.2

  # UI & Utilities
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  google_fonts: ^8.1.0

  # Notifications
  flutter_local_notifications: ^22.0.1
  flutter_map: ^8.3.0
  latlong2: ^0.10.1
  country_picker: ^2.0.28
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.2
  flutter_tts: ^4.2.5
  path_provider: ^2.1.6
  record: ^7.1.0

  flutter_compass: ^0.8.1
  get_it: ^9.2.1
  envied: ^1.3.8
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  very_good_analysis: ^10.3.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  envied_generator: ^1.3.8
  build_runner: ^2.15.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo-icon.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#F8F9FA"
  image: "assets/images/logo.png"
  android_12:
    image: "assets/images/logo.png"
    icon_background_color: "#F8F9FA"
  android: true
  ios: true
