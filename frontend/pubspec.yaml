name: frontend
description: "HostSigchos - Sistema de Reservas de Hosterías de Sigchos"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5

  # Google Sign-In
  google_sign_in: ^6.2.2

  # State Management
  provider: ^6.1.2

  # Google Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  
  # API REST (Geocoding)
  http: ^1.3.0

  # Camera (Hardware)
  image_picker: ^1.1.2

  # UI & Utilities
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
